.badge{display:inline-block;font-family:'Barlow Condensed';font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--launch);color:#fff;padding:1px 6px;border-radius:2px}

@media(max-width:1100px){.two,.three{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){main{padding:16px}.hbar{padding:10px 16px;flex-wrap:wrap}.hmeta{margin-left:0;text-align:left}nav{padding:0 8px}.cal{gap:2px}.cell{min-height:64px;padding:4px 4px 8px}.cell .ln,.cell .ev,.cell .dd{display:none}.cell .mv{font-size:12px}.cell .lc{font-size:9px;right:2px;top:2px;padding:0 3px}.kpi .v{font-size:21px}}

<script>
const PAY=/*__DATA__*/null;
const D=PAY.daily, DI={}; D.forEach(r=>DI[r.d]=r);
const $=(s,c)=>(c||document).querySelector(s);
const ok=v=>typeof v==='number'&&isFinite(v);
const n0=v=>!ok(v)?'—':Math.round(v).toLocaleString('en-CA');
const m0=v=>!ok(v)?'—':(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString('en-CA');
const m2=v=>!ok(v)?'—':'$'+v.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2});
const pc=(v,d)=>!ok(v)?'—':(v*100).toFixed(d==null?2:d)+'%';
const kk=v=>!ok(v)?'—':(v<0?'-$':'$')+(Math.abs(v)>=1e6?(Math.abs(v)/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?(Math.abs(v)/1e3).toFixed(1)+'k':Math.round(Math.abs(v)));
const dl=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const fd=s=>dl(s).toLocaleDateString('en-CA',{weekday:'short',day:'numeric',month:'short'});
const fds=s=>dl(s).toLocaleDateString('en-CA',{day:'numeric',month:'short'});
const fdl=s=>dl(s).toLocaleDateString('en-CA',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const delta=(a,b)=>(!ok(a)||!ok(b)||!b)?null:(a-b)/Math.abs(b);
const dsp=(v,lab)=>!ok(v)?'<span class="d">—</span>':`<span class="d ${v>=0?'up':'down'}">${v>=0?'▲':'▼'} ${(Math.abs(v)*100).toFixed(1)}% ${lab||'YoY'}</span>`;
const dspInv=(v,lab)=>!ok(v)?'<span class="d">—</span>':`<span class="d ${v<=0?'up':'down'}">${v>=0?'▲':'▼'} ${(Math.abs(v)*100).toFixed(1)}% ${lab||'YoY'}</span>`;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sum=(rs,k)=>rs.reduce((a,r)=>a+(ok(r[k])?r[k]:0),0);
const rng=(s,e)=>D.filter(r=>r.d>=s&&r.d<=e);
const agg=(rs,pre)=>{pre=pre||'';const net=sum(rs,pre+'net'),ses=sum(rs,pre+'sess'),ord=sum(rs,pre+'orders');
  let w=0,o=0;rs.forEach(r=>{const q=r[pre+'orders'],a=r[pre+'aov'];if(ok(q)&&ok(a)){w+=q*a;o+=q;}});
  return {net,gross:sum(rs,pre+'gross'),disc:sum(rs,pre+'disc'),ret:sum(rs,pre+'ret'),sess:ses,orders:ord,cvr:ses?ord/ses:null,aov:o?w/o:null};};
const LBYD={};PAY.launches.forEach(l=>(LBYD[l.d]=LBYD[l.d]||[]).push(l));
const EBYD={};PAY.events.forEach(e=>(EBYD[e.d]=EBYD[e.d]||[]).push(e));
const periodOf=d=>PAY.periods.find(p=>p.s<=d&&d<=p.e);
const KC=k=>css('--'+k);

/* ---------- theme ---------- */
(function(){let t=null;try{t=localStorage.getItem('ls-theme');}catch(e){}
 if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
 document.documentElement.dataset.theme=t;
 $('#themebtn').onclick=()=>{const n=document.documentElement.dataset.theme==='light'?'dark':'light';
  document.documentElement.dataset.theme=n;try{localStorage.setItem('ls-theme',n);}catch(e){}
  Object.values(CH).forEach(c=>c.destroy());for(const k in CH)delete CH[k];RENDERED.clear();show(cur);};})();

/* ---------- charts ---------- */
const CH={};

   if(va==null)return 1;if(vb==null)return -1;return (va>vb?1:va<vb?-1:0)*sd;});}
  el.innerHTML=`<div class="tw" style="${opts.h?'max-height:'+opts.h+'px':''}"><table><thead><tr>${cols.map(c=>`<th class="${c.l?'l':''}" data-k="${c.k}" title="Sort">${c.t}${sk===c.k?(sd<0?' ▾':' ▴'):''}</th>`).join('')}</tr></thead><tbody>${
   rs.map(r=>`<tr class="${opts.rowcls?opts.rowcls(r):''}" ${opts.click?`data-d="${esc(r[opts.click])}" style="cursor:pointer"`:''}>${cols.map(c=>`<td class="${c.l?'l':''} ${c.cls||''}">${c.f?c.f(r):esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.querySelectorAll('th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sk===k)sd=-sd;else{sk=k;sd=-1;}draw();});

 const dowAgg=pre=>DOW.map(d=>{const rs=D.filter(r=>r.dow===d);return sum(rs,pre+'net')/rs.length;});
 const dowCvr=pre=>DOW.map(d=>{const rs=D.filter(r=>r.dow===d);return sum(rs,pre+'orders')/sum(rs,pre+'sess');});
 // weeks Sun-Sat
 const wk={};D.forEach(r=>{const dt=dl(r.d);dt.setDate(dt.getDate()-dt.getDay());const k=dt.toISOString().slice(0,10);(wk[k]=wk[k]||[]).push(r);});
 const weeks=Object.entries(wk).map(([k,rs])=>{const a=agg(rs),b=agg(rs,'py_');return {w:k,days:rs.length,s:rs[0].d,e:rs[rs.length-1].d,net:a.net,py:b.net,dn:delta(a.net,b.net),sess:a.sess,ds:delta(a.sess,b.sess),cvr:a.cvr,aov:a.aov,lc:rs.reduce((x,r)=>x+(LBYD[r.d]||[]).length,0),g:sum(rs,'g_cost')};});
 $('#t-ramp').innerHTML=rail()+`<div class="sec"><div class="sech"><h2>The underlying trend</h2><span class="sub">Seven-day centred average of net sales removes day-of-week and launch-day noise</span></div>
 <div class="legend"><span><i class="sw ln" style="background:var(--cy)"></i>2025, 7-day avg</span><span><i class="sw dash"></i>2024 same date, 7-day avg</span></div>
 <div class="panel"><div class="chartbox"><canvas id="c-rm"></canvas></div></div></div>
 <div class="sec"><div class="sech"><h2>Sessions trend</h2><span class="sub">Seven-day centred average</span></div><div class="panel"><div class="chartbox sm"><canvas id="c-rs"></canvas></div></div></div>
 <div class="two"><div class="sec"><div class="sech"><h2>Day-of-week effect</h2><span class="sub">Average net sales per weekday</span></div>
  <div class="legend"><span><i class="sw" style="background:var(--cy)"></i>2025</span><span><i class="sw" style="background:var(--py)"></i>2024</span></div><div class="panel"><div class="chartbox sm"><canvas id="c-dw"></canvas></div></div></div>
  <div class="sec"><div class="sech"><h2>Conversion by weekday</h2><span class="sub">Orders ÷ sessions</span></div>
  <div class="legend"><span><i class="sw" style="background:var(--cy)"></i>2025</span><span><i class="sw" style="background:var(--py)"></i>2024</span></div><div class="panel"><div class="chartbox sm"><canvas id="c-dc"></canvas></div></div></div></div>
 <div class="note">Friday and Saturday carry <b>${pc((sum(D.filter(r=>r.dow==='Fri'||r.dow==='Sat'),'net'))/agg(D).net,0)}</b> of Q4 net sales. That is where Livestock's release calendar concentrates. Sunday and Monday are the quietest days, which makes them the cheapest window for brand and story content.</div>
 <div class="sec"><div class="sech"><h2>Weekly shape</h2><span class="sub">Sunday to Saturday weeks, same-date YoY</span></div><div id="rm-t"></div></div>`;
 mk('c-rm',{type:'line',data:{labels:LABELS,datasets:[cyDs('2025 7-day avg',ma('net')),pyDs('2024 7-day avg',ma('py_net'))]},options:lineOpts('money',{plugins:{markers:{days:evMarkers()}}})});
 mk('c-rs',{type:'line',data:{labels:LABELS,datasets:[cyDs('2025 sessions',ma('sess')),pyDs('2024 sessions',ma('py_sess'))]},options:lineOpts('num')});
 mk('c-dw',{type:'bar',data:{labels:DOW,datasets:[{label:'2025',data:dowAgg(''),backgroundColor:css('--cy')},{label:'2024',data:dowAgg('py_'),backgroundColor:css('--py')}]},options:barOpts('money')});
 mk('c-dc',{type:'bar',data:{labels:DOW,datasets:[{label:'2025',data:dowCvr(''),backgroundColor:css('--cy')},{label:'2024',data:dowCvr('py_'),backgroundColor:css('--py')}]},options:barOpts('pct')});
 table($('#rm-t'),[{k:'w',t:'Week of',l:1,cls:'strong',f:r=>fds(r.s)+' – '+fds(r.e)},{k:'net',t:'Net',f:r=>m0(r.net)},{k:'py',t:'2024',f:r=>m0(r.py)},{k:'dn',t:'Δ net',f:r=>dcell(r.dn)},
  {k:'sess',t:'Sessions',f:r=>n0(r.sess)},{k:'ds',t:'Δ sess',f:r=>dcell(r.ds)},{k:'cvr',t:'CVR',f:r=>pc(r.cvr)},{k:'aov',t:'AOV',f:r=>m2(r.aov)},{k:'g',t:'Ads spend',f:r=>m0(r.g)},{k:'lc',t:'Launches',f:r=>r.lc}],weeks);};

 if(HAS_CHAN){const wk={};Object.entries(PAY.chan_daily).forEach(([d,rs])=>{const dt=dl(d);dt.setDate(dt.getDate()-dt.getDay());const k=dt.toISOString().slice(0,10);
  const w=wk[k]=wk[k]||{};rs.forEach(x=>{const c=CH_TOP.includes(x.ch)?x.ch:'Other';w[c]=w[c]||{rev:0,sess:0};w[c].rev+=x.rev||0;w[c].sess+=x.sess||0;});});

 <div class="note"><b>Read-out.</b> Spend more than doubled. Nearly all of the increase is the new <b>shop_catchall_footwear</b> Shopping campaign, created 23 Sep (per its campaign group) and now paused: ${m0(20013.32)} for 1,277 conversions at ${m2(15.67)}. That is 2.7× the cost per conversion of the existing <b>shop-inline</b> campaign (${m2(5.88)}). Branded search spend tripled to ${m0(1622.85)}, and branded keyword CTR fell from ~72% to ~46%. That points to more competition on "livestock" and "deadstock" terms. Much of the Shopping spend went to generic ASICS and Salomon queries and competitor names (JD Sports, Foot Locker). The search term export reports no conversions at query level, so their return can't be judged from this file.</div>
 <div class="sec"><div class="sech"><h2>Campaigns</h2></div><div id="g-camp"></div></div>
 <div class="two"><div class="sec"><div class="sech"><h2>Devices</h2></div><div id="g-dev"></div></div><div class="sec"><div class="sech"><h2>Branded keywords</h2></div><div id="g-kw"></div></div></div>
 <div class="sec"><div class="sech"><h2>Impressions by day and hour</h2><span class="sub">Darker = more impressions. Peak is 5–8 pm</span></div><div class="panel" style="overflow-x:auto"><div class="hm" id="g-hm"></div></div></div>
 <div class="two"><div class="sec"><div class="sech"><h2>Top search terms</h2><span class="sub">By impressions</span></div><div id="g-sq"></div></div><div class="sec"><div class="sech"><h2>Search words</h2><span class="sub">Single words across all queries</span></div><div id="g-w"></div></div></div>
 <div class="two"><div class="sec"><div class="sech"><h2>Age</h2><span class="sub">Impressions, known ages</span></div><div class="panel"><div class="chartbox xs"><canvas id="g-age"></canvas></div></div></div>
 <div class="sec"><div class="sech"><h2>Gender</h2><span class="sub">Impressions, known gender</span></div><div class="panel"><div class="chartbox xs"><canvas id="g-gen"></canvas></div></div></div></div>`;
 mk('c-gs',{type:'line',data:{labels:LABELS,datasets:[cyDs('2025 spend',D.map(r=>r.g_cost)),pyDs('2024 spend',D.map(r=>r.py_g_cost))]},options:lineOpts('money',{plugins:{markers:{days:evMarkers()}}})});
 mk('c-gv',{type:'line',data:{labels:LABELS,datasets:[cyDs('2025 conv.',D.map(r=>r.g_conv)),pyDs('2024 conv.',D.map(r=>r.py_g_conv))]},options:lineOpts('num')});
 mk('c-gc',{type:'line',data:{labels:LABELS,datasets:[cyDs('2025 cost/conv.',D.map(r=>r.g_conv?r.g_cost/r.g_conv:null)),pyDs('2024 cost/conv.',D.map(r=>r.py_g_conv?r.py_g_cost/r.py_g_conv:null))]},options:lineOpts('money2')});
 table($('#g-camp'),[{k:'name',t:'Campaign',l:1,cls:'strong'},{k:'status',t:'Status',l:1},{k:'cost',t:'Cost',f:r=>m2(r.cost)},{k:'py_cost',t:'Cost 2024',f:r=>m2(r.py_cost)},{k:'conv',t:'Conv.',f:r=>n0(r.conv)},{k:'py_conv',t:'Conv. 2024',f:r=>n0(r.py_conv)},{k:'cpa',t:'Cost / conv.',f:r=>m2(r.cpa)},{k:'py_cpa',t:'2024',f:r=>m2(r.py_cpa)}],A.campaigns);
 table($('#g-dev'),[{k:'dev',t:'Device',l:1,cls:'strong'},{k:'cost',t:'Cost',f:r=>m0(r.cost)},{k:'dc',t:'Δ',v:r=>delta(r.cost,r.py_cost),f:r=>dcell(delta(r.cost,r.py_cost))},{k:'clk',t:'Clicks',f:r=>n0(r.clk)},{k:'conv',t:'Conv.',f:r=>n0(r.conv)},{k:'cpa',t:'Cost / conv.',v:r=>r.conv?r.cost/r.conv:null,f:r=>r.conv?m2(r.cost/r.conv):'—'}],A.devices.filter(d=>d.cost>0));
 table($('#g-kw'),[{k:'kw',t:'Keyword',l:1,cls:'strong'},{k:'cost',t:'Cost',f:r=>m2(r.cost)},{k:'clk',t:'Clicks',f:r=>n0(r.clk)},{k:'py_clk',t:'2024',f:r=>n0(r.py_clk)},{k:'ctr',t:'CTR',f:r=>ok(r.ctr)?r.ctr.toFixed(1)+'%':'—'},{k:'py_ctr',t:'CTR 2024',f:r=>ok(r.py_ctr)?r.py_ctr.toFixed(1)+'%':'—'}],A.keywords);
 const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],HRS=[...Array(24)].map((_,i)=>i===0?'12 AM':i<12?i+' AM':i===12?'12 PM':(i-12)+' PM');
 const hmx=Math.max(...A.dayhour.map(x=>x.imp));let hm='<div></div>'+HRS.map((h,i)=>`<div>${i%3===0?h.replace(' ',''):''}</div>`).join('');
 DAYS.forEach(d=>{hm+=`<div class="lab">${d.slice(0,3)}</div>`;HRS.forEach(h=>{const x=A.dayhour.find(z=>z.day===d&&z.hr===h);const t=x?x.imp/hmx:0;
  hm+=`<div title="${d} ${h}: ${n0(x&&x.imp)} impressions (2024: ${n0(x&&x.py_imp)})" style="background:color-mix(in oklab, ${css('--heat0')}, ${css('--heat2')} ${Math.round(t*100)}%)"></div>`;});});
 $('#g-hm').innerHTML=hm;
 table($('#g-sq'),[{k:'q',t:'Search term',l:1,cls:'strong'},{k:'imp',t:'Impr.',f:r=>n0(r.imp)},{k:'clk',t:'Clicks',f:r=>n0(r.clk)},{k:'cost',t:'Cost',f:r=>m2(r.cost)},{k:'cpc',t:'CPC',v:r=>r.clk?r.cost/r.clk:null,f:r=>r.clk?m2(r.cost/r.clk):'—'}],A.searches,{h:420});
 table($('#g-w'),[{k:'w',t:'Word',l:1,cls:'strong'},{k:'imp',t:'Impr.',f:r=>n0(r.imp)},{k:'clk',t:'Clicks',f:r=>n0(r.clk)},{k:'cost',t:'Cost',f:r=>m2(r.cost)},{k:'top',t:'Top queries',l:1}],A.words,{h:420});
 mk('g-age',{type:'bar',data:{labels:A.age.map(a=>a.k),datasets:[{label:'2025',data:A.age.map(a=>a.imp),backgroundColor:css('--cy')},{label:'2024',data:A.age.map(a=>a.py_imp),backgroundColor:css('--py')}]},options:barOpts('num')});
 mk('g-gen',{type:'bar',data:{labels:A.gender.map(a=>a.k),datasets:[{label:'2025',data:A.gender.map(a=>a.imp),backgroundColor:css('--cy')},{label:'2024',data:A.gender.map(a=>a.py_imp),backgroundColor:css('--py')}]},options:barOpts('num',true)});};

let paidView='scen';
RENDER.paid=()=>{$('#t-paid').innerHTML=rail()+`<div class="ctl" id="paid-sw"><span class="gl">Section</span><button class="chip ${paidView==='scen'?'on':''}" data-v="scen">Paid scenarios</button><button class="chip ${paidView==='perf'?'on':''}" data-v="perf">Google Ads performance</button></div><div id="paid-body"></div>`;
 const go=()=>{Object.keys(CH).filter(k=>/^(sc|c-g|g-)/.test(k)).forEach(k=>{CH[k].destroy();delete CH[k];});paidView==='scen'?renderScenarios($('#paid-body')):renderPaidPerf();};
 $('#paid-sw').onclick=e=>{const v=e.target.dataset.v;if(!v)return;paidView=v;$('#paid-sw').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.v===v));go();};go();};

/* ---- Organic search ---- */
RENDER.seo=()=>{const G=PAY.gsc,ck=sum(D,'sc_clk'),im=sum(D,'sc_imp');
 const brand=G.queries.filter(q=>/livestock|deadstock|live stock|dead stock/.test(q.k)).reduce((a,q)=>a+q.clk,0),topc=G.queries.reduce((a,q)=>a+q.clk,0);
 $('#t-seo').innerHTML=rail()+`<div class="sec"><div class="sech"><h2>Google Search Console · web</h2><span class="sub">deadstock.ca, 1 Oct – 31 Dec 2025 (no prior year in export)</span></div>
 <div class="kpis">${kpi('Clicks',n0(ck),'')}${kpi('Impressions',n0(im),'')}${kpi('CTR',pc(ck/im),'')}${kpi('Canada share of clicks',pc(G.countries[0].clk/ck,1),'')}
 ${kpi('Brand share, top 60 queries',pc(brand/topc,0),'<span class="d">livestock / deadstock terms</span>')}${kpi('Mobile share of clicks',pc(G.devices[0].clk/ck,1),'')}</div></div>
 <div class="two"><div class="sec"><div class="sech"><h2>Daily organic clicks</h2></div><div class="panel"><div class="chartbox sm"><canvas id="s-c"></canvas></div></div></div>
 <div class="sec"><div class="sech"><h2>Daily impressions</h2></div><div class="panel"><div class="chartbox sm"><canvas id="s-i"></canvas></div></div></div></div>
 <div class="note">Organic search is mostly navigational. "livestock" alone drove <b>${n0(G.queries[0].clk)}</b> clicks, and city modifiers (Toronto, Vancouver, Montreal, Winnipeg) rank at position ~1. Product-level wins came from a small number of hype SKUs (adidas BW Army, Arc'teryx Bird Head toque, Jordan 4). Merchant listings earn a <b>${pc(G.appearance.find(a=>a.k==='Merchant listings').ctr,1)}</b> CTR against ${pc(G.appearance.find(a=>a.k==='Product snippets').ctr,1)} for product snippets.</div>
 <div class="two"><div class="sec"><div class="sech"><h2>Top queries</h2></div><div id="s-q"></div></div><div class="sec"><div class="sech"><h2>Top pages</h2></div><div id="s-p"></div></div></div>
 <div class="three"><div class="sec"><div class="sech"><h2>Countries</h2></div><div id="s-co"></div></div><div class="sec"><div class="sech"><h2>Devices</h2></div><div id="s-d"></div></div><div class="sec"><div class="sech"><h2>Search appearance</h2></div><div id="s-a"></div></div></div>`;
 mk('s-c',{type:'line',data:{labels:LABELS,datasets:[cyDs('Clicks',D.map(r=>r.sc_clk))]},options:lineOpts('num',{plugins:{markers:{days:evMarkers()}}})});
 mk('s-i',{type:'line',data:{labels:LABELS,datasets:[cyDs('Impressions',D.map(r=>r.sc_imp))]},options:lineOpts('num')});
 const gcols=(t)=>[{k:'k',t,l:1,cls:'strong',f:r=>esc(String(r.k).replace(/^https?:\/\/(www\.)?deadstock\.ca/,'')||'/')},{k:'clk',t:'Clicks',f:r=>n0(r.clk)},{k:'imp',t:'Impr.',f:r=>n0(r.imp)},{k:'ctr',t:'CTR',f:r=>pc(r.ctr,1)},{k:'pos',t:'Pos.',f:r=>ok(r.pos)?r.pos.toFixed(1):'—'}];
 table($('#s-q'),gcols('Query'),G.queries,{h:460});table($('#s-p'),gcols('Page'),G.pages,{h:460});
 table($('#s-co'),gcols('Country'),G.countries,{h:380});table($('#s-d'),gcols('Device'),G.devices);table($('#s-a'),gcols('Appearance'),G.appearance);};

/* ---- Notes ---- */
RENDER.notes=()=>{$('#t-notes').innerHTML=`<div class="sec"><div class="sech"><h2>Sources</h2></div><div class="ins">
 <div><h4>Shopify · Total sales breakdown</h4><p>Daily net sales, discounts, sales reversals (returns), sessions, conversion rate and AOV, 1 Oct – 31 Dec 2025 against the same dates in 2024. Gross sales = net + discounts + reversals. <b>Orders are estimated</b> as sessions × conversion rate, because the export has no order count.</p></div>
 <div><h4>Google Ads · Overview cards</h4><p>Daily cost, clicks and conversions plus campaign, device, keyword, search term, demographic and day×hour cards. Google aligns the comparison on weekday (1 Oct 2025 ↔ 2 Oct 2024). Conversions are Google-attributed and not deduplicated against Shopify.</p></div>
 <div><h4>Google Search Console</h4><p>Web search performance for deadstock.ca: daily clicks, impressions, CTR and position, plus queries, pages, countries, devices and search appearance. The export has no prior-year comparison.</p></div>
 <div><h4>GA4</h4><p>User acquisition by first-user channel (users, key events, revenue, transactions) and pages and screens by title (views, users, key events). GA4 revenue (${kk(PAY.ga_total.rev)}) is gross and differs from Shopify net sales by design.</p></div>
 <div><h4>Release calendar</h4><p>${PAY.launches.length} launches transcribed from the launch calendar screenshots. Each launch is matched to its GA4 product page by name, and ${PAY.launches.filter(l=>l.match).length} matched. Lines truncated in the screenshot (e.g. "Show all (4)" on 10 Oct) may be incomplete.</p></div>
 <div><h4>Klaviyo campaigns</h4><p>${(PAY.comms||[]).length} email campaigns sent 1 Oct – 31 Dec 2025: recipients, open and click rates, active on site, unsubscribes. The export has no revenue column. Sale dates on the timeline (early Black Friday 13 Nov, 70% off 25 Nov, last chance 2 Dec, Boxing Week 24 Dec) come from these sends.</p></div>
 <div><h4>Brand performance report</h4><p>The YouTube/Display brand performance export contained no data (all nulls), so it is not charted.</p></div></div></div>
 <div class="sec"><div class="sech"><h2>Caveats</h2></div>
 <div class="note">Trading periods are analytical windows. Sale moments on the timeline are inferred from Klaviyo send dates and subject lines, not from a promo calendar. Edit <code>periods</code> and <code>events</code> in <code>build/build_data.py</code> to change them. The same-date YoY puts Black Friday 2025 (28 Nov) against US Thanksgiving 2024. Use the "same weekday" comparison on the Performance tab, or the BFCM tab, for event-aligned reads.</div></div>`;};
